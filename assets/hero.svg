<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="nocap: NO CAP. It asks before rm -rf. A plain-English terminal UI for Claude Code. A high-risk approval card for rm -rf build dist offers to move the files to trash, with y, n and a keys. Narrated locally, zero extra tokens." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.se{font-family:Georgia,"Times New Roman",serif}.bl{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dr{}@keyframes dr{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
<rect width="1200" height="500" fill="#ffe14d"/><rect x="16" y="16" width="1168" height="468" fill="none" stroke="#111" stroke-width="6"/>
<text x="54" y="190" class="bl" font-size="170" font-weight="900" fill="#111" letter-spacing="-4">NO CAP.</text>
<g class="in" style="animation-delay:0.5s"><rect x="48" y="224" width="780" height="104" fill="#111"/><text x="70" y="298" class="bl" font-size="62" font-weight="900" fill="#ffe14d">IT ASKS BEFORE rm -rf</text></g>
<text x="56" y="394" class="sa in" style="animation-delay:0.9s" font-size="26" font-weight="700" fill="#111">A plain-English terminal UI for Claude Code.</text>
<text x="56" y="430" class="mo in" style="animation-delay:1.1s" font-size="18" fill="#111">npx @sudhanshu1402/nocap</text>
<g class="in" style="animation-delay:1.3s"><rect x="880" y="120" width="260" height="210" rx="10" fill="#fff" stroke="#111" stroke-width="5"/><rect x="880" y="120" width="260" height="44" rx="10" fill="#ff3b1f"/><rect x="880" y="150" width="260" height="14" fill="#ff3b1f"/>
<text x="1010" y="150" text-anchor="middle" class="bl" font-size="18" fill="#fff">HIGH RISK</text>
<text x="904" y="200" class="mo" font-size="17" font-weight="700" fill="#111">rm -rf build dist</text>
<text x="904" y="228" class="sa" font-size="14" fill="#333">deletes files permanently.</text><text x="904" y="248" class="sa" font-size="14" fill="#333">move them to trash instead?</text>
<g class="mo" font-size="16" font-weight="700"><rect x="904" y="276" width="62" height="34" fill="#111"/><text x="935" y="299" text-anchor="middle" fill="#ffe14d">y</text>
<rect x="978" y="276" width="62" height="34" fill="#fff" stroke="#111" stroke-width="3"/><text x="1009" y="299" text-anchor="middle" fill="#111">n</text>
<rect x="1052" y="276" width="62" height="34" fill="#fff" stroke="#111" stroke-width="3"/><text x="1083" y="299" text-anchor="middle" fill="#111">a</text></g></g>
<g class="in" style="animation-delay:1.6s"><rect x="880" y="360" width="260" height="70" fill="#111"/><text x="1010" y="392" text-anchor="middle" class="sa" font-size="15" font-weight="700" fill="#ffe14d">NARRATED LOCALLY</text><text x="1010" y="414" text-anchor="middle" class="sa" font-size="14" fill="#fff">zero extra tokens</text></g></svg>